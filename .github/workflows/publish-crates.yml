name: Publish Rust crates

# One 0.1.<patch> release per 10 commits, and only from a commit whose workspace is green.
#
# The version sequence lives on crates.io, not in this repo: the workflow does NOT commit its own
# version bump, because that commit would advance the very counter that triggered the release
# (a release that schedules its own successor). See release/release-state.mjs for the full reasoning,
# including why the cadence is measured as "10-commit windows elapsed vs releases published" rather
# than `commit_count % 10 == 0` — the hourly automation here pushes batches, which can step straight
# over an exact multiple and silently skip a release.
#
# Publishing is irreversible (crates.io allows yank, never delete) and each published version is
# permanent, so the gate below is not decoration: no green build, no release.

# =====================================================================================================
# DISARMED 2026-09-16 by the verifier. The owner's standing instruction is "dont push the crate yet have it
# locally mapped", and this workflow was armed on `push: branches: [migration-to-rust]` — the branch every
# hourly push goes to — with a live CARGO_REGISTRY_TOKEN secret in this repo. It had already run several
# times (one run in flight when checked; cancelled). Nothing was ever published: the crates.io sparse index
# and API both return 404 for `base-ui-leptos`. Publishing is the OWNER's decision, not an iteration's, so
# the push trigger is removed and a manual dispatch now defaults to a dry run; `force: true` is required to
# upload anything.
# =====================================================================================================
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish one release now, ignoring the 10-commit cadence (requires the owner to have authorised publication)'
        type: boolean
        default: false
      dry-run:
        description: 'Run the plan + gate, skip the upload'
        type: boolean
        default: true

permissions:
  contents: read

# The committed `.cargo/config.toml` pins `target-dir = "/data/cargo-target"` for the dev box. That
# path does not exist on a runner and cargo dies with "failed to create directory `/data`:
# Permission denied (os error 13)" — the same trap deploy-docs-app.yml already works around. Env
# beats config, so this one line keeps the gate and the publish job building inside the checkout.
env:
  CARGO_TARGET_DIR: target

# NOTE: exclusivity deliberately is NOT a workflow-level concurrency group. See the `publish` job:
# this repo pushes constantly (the loop commits every few minutes), and a group shared with those
# push-triggered runs let one of them cancel a live publish mid-sequence on 2026-09-16.

jobs:
  plan:
    name: Is a release due?
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      next_version: ${{ steps.plan.outputs.next_version }}
      publish_order: ${{ steps.plan.outputs.publish_order }}
      releases_behind: ${{ steps.plan.outputs.releases_behind }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the counter's origin is found with `git log --diff-filter=A`
      - name: Plan the release
        id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          node release/release-state.mjs ${FORCE:+--force} --github-output | tee -a "$GITHUB_STEP_SUMMARY"

  gate:
    name: Green gate (nothing publishes red)
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
      - name: Ledger + citation gates
        run: |
          set -euo pipefail
          node ralph/scripts/check-citations.mjs
          node ralph/scripts/check-todo-schema.mjs
      - name: Workspace tests (host)
        run: cargo test --workspace
      - name: Published crates compile for wasm32
        run: |
          set -euo pipefail
          cargo check -p base-ui-leptos-utils --target wasm32-unknown-unknown
          cargo check -p base-ui-leptos-internals --target wasm32-unknown-unknown
          cargo check -p base-ui-leptos --target wasm32-unknown-unknown
      # The docs-app build (cargo-leptos) is deliberately NOT repeated here: deploy-docs-app.yml
      # already builds and deploys it on every push to this branch, so a green deploy is the
      # docs-app evidence for the same commit. This gate covers what the REGISTRY receives.

  publish:
    name: Publish ${{ needs.plan.outputs.next_version }} to crates.io
    needs: [plan, gate]
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # Exclusivity lives HERE, not at workflow level. A workflow-level group is shared with the
    # push-triggered plan runs, and this repo pushes constantly: on 2026-09-16 a push entering that
    # group cancelled a live publish between its second and third crate, leaving a half-published
    # release (utils + internals at 0.1.1, the component crate missing). Only real publishes need
    # mutual exclusion, so only real publishes take the group.
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
      # The plan ran minutes ago, before the gate. Re-read the registry here: a concurrent run (or the
      # push-triggered plan of a later commit) may have published already, and a stale plan would
      # either re-publish a version that exists or advance past a half-finished one. This step is also
      # what makes concurrent publishes safe rather than merely unlikely — the loser of the race finds
      # nothing due and exits green instead of failing on "version already exists".
      - name: Re-check the registry
        id: fresh
        run: node release/release-state.mjs --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stamp the release version
        if: steps.fresh.outputs.should_publish == 'true'
        run: node release/set-version.mjs "${{ steps.fresh.outputs.next_version }}"
      - name: Publish in dependency order
        if: ${{ steps.fresh.outputs.should_publish == 'true' && inputs.dry-run != true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          IFS=',' read -ra CRATES <<< "${{ steps.fresh.outputs.publish_order }}"
          for crate in "${CRATES[@]}"; do
            echo "::group::publish $crate"
            ok=0
            # After publishing a dependency, the sparse index needs a moment before the dependent
            # crate's requirement can be resolved — hence the retry rather than a bare publish.
            for attempt in 1 2 3 4 5 6; do
              if cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN" -p "$crate"; then ok=1; break; fi
              echo "attempt $attempt for $crate failed; waiting for the index to catch up"
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "::error::could not publish $crate"; exit 1; }
            echo "::endgroup::"
          done
      - name: Verify what the registry actually serves
        if: steps.fresh.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.fresh.outputs.next_version }}"
          for crate in $(echo "${{ steps.fresh.outputs.publish_order }}" | tr ',' ' '); do
            sleep 10
            served=$(curl -fsS -A "publish-crates-workflow" "https://crates.io/api/v1/crates/$crate" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.crate.max_version)})')
            echo "$crate serves $served"
            [ "$served" = "$ver" ] || { echo "::error::$crate max_version is $served, expected $ver"; exit 1; }
          done
      - name: Record the version -> commit mapping
        if: always()
        run: |
          {
            echo "### crates.io release"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| version | \`${{ steps.fresh.outputs.next_version }}\` |"
            echo "| version planned at gate time | \`${{ needs.plan.outputs.next_version }}\` (differs only if a concurrent run published first) |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| crates | \`${{ steps.fresh.outputs.publish_order }}\` |"
            echo "| releases behind before this run | ${{ needs.plan.outputs.releases_behind }} |"
            echo ""
            echo "crates.io records the repository URL but NOT the commit, so this table is the"
            echo "traceability record for the published source."
          } >> "$GITHUB_STEP_SUMMARY"
