[workspace]
resolver = "3"
members = ["crates/leptos-ui-utils", "crates/leptos-ui-internals", "crates/leptos-ui", "crates/docs-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mui/base-ui"

[workspace.dependencies]
floating-ui-core = "0.6.0"
floating-ui-dom = "0.6.0"
floating-ui-utils = "0.6.0"
futures = "0.3"
jiff = { version = "0.2.35", default-features = false, features = ["std", "tzdb-bundle-always", "js"] }
js-sys = "0.3"
leptos = { version = "0.7", features = ["hydrate"] }
reactive_graph = { version = "0.2", default-features = false, features = ["effects"] }
send_wrapper = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = "0.3"

[[workspace.metadata.leptos]]
name = "docs-app"
bin-package = "docs-app"
lib-package = "docs-app"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
# The docs chrome (layout shell, header, side nav, typography) is carried by a real stylesheet,
# exactly as upstream's docs site carries `docs/src/css/index.css` + `docs/src/app/(docs)/layout.css`:
# cargo-leptos compiles `style-file` to `/<site-pkg-dir>/docs-app.css` (the file `index.html` links)
# and copies `assets-dir` into the site root, so `/fonts/*.woff2` resolves the way it does on the
# React site. Both paths are relative to the workspace root, which is what cargo-leptos makes the
# working dir (`cargo_leptos` `lib.rs`, `env::set_current_dir(&config.working_dir)`), so they do not
# depend on where the build was invoked from.
#
# These keys belong HERE, not in `crates/docs-app/Cargo.toml`. A package-level
# `[package.metadata.leptos]` is an ADDITIONAL project, not an override: cargo-leptos would build
# the same app twice, and the package-level project's default site-root is
# `<target-dir>/site` — a second, unserved site directory. Without `style-file` here cargo-leptos
# emits an EMPTY docs-app.css with no warning, which is why every ported page rendered as bare
# browser defaults.
style-file = "crates/docs-app/style/main.css"
assets-dir = "crates/docs-app/assets"
