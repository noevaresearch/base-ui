[package]
name = "docs-app"
description = "Documentation application for the Leptos port of Base UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

# The docs chrome stylesheet (compiled to `/pkg/docs-app.css`, linked by `index.html`) and the
# font assets it references are configured in the WORKSPACE metadata entry in the root
# `Cargo.toml` (`style-file` / `assets-dir`), not here.
#
# A `[package.metadata.leptos]` section in this file is not an override of that entry: it is a
# SECOND project, so cargo-leptos builds docs-app twice and the package-level project's default
# site-root is `<target-dir>/site` — a site directory nothing serves (the gate, the SPA server and
# the fidelity harness all use the workspace `site-root = "target/site"`). Verified by building
# both ways: with a package-level entry the served `docs-app.css` stayed 1 byte (empty) while the
# real stylesheet landed in the unserved directory.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
any_spawner = { version = "0.3", features = ["futures-executor", "wasm-bindgen"] }
wasm-bindgen = { workspace = true }
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
reactive_graph = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
base-ui-leptos = { path = "../leptos-ui", version = "0.1.0" }
base-ui-leptos-internals = { path = "../leptos-ui-internals", version = "0.1.0" }
js-sys = { workspace = true }
base-ui-leptos-utils = { path = "../leptos-ui-utils", version = "0.1.0" }
send_wrapper = { workspace = true }
web-sys = { workspace = true, features = [
  "Clipboard",
  "Document",
  "Element",
  "Event",
  "EventInit",
  "FormData",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "MouseEvent",
  "Navigator",
  "Node",
  "Url",
  "Window",
] }

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }
js-sys = { workspace = true }
# The nav → route drift guard lives in `tests/nav_routes.rs` (its own wasm test page — see that
# file's module docs for why). An integration target is its own crate, so it does NOT inherit the
# lib's dependencies: it mounts `docs_app::App` through the real router and therefore needs leptos
# itself, plus `wasm-bindgen-futures` for its turn-flush helper.
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = { workspace = true }
# `History` is for the chrome tests: `pin_url` pins the URL with `replaceState` before a Router
# mount (NOT `pushState` + `popstate` — see `pin_url`'s note: dispatching popstate also notifies
# routers left over from earlier tests, whose listeners panic on a disposed signal).
web-sys = { workspace = true, features = [
  "Event",
  "EventInit",
  "History",
  "MouseEvent",
  "MouseEventInit",
  "Window",
] }