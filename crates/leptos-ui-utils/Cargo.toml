[package]
name = "leptos-ui-utils"
description = "Shared utilities for the Leptos port of Base UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
js-sys = { workspace = true }
reactive_graph = { workspace = true }
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
  "AddEventListenerOptions",
  "console",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventListenerOptions",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "MouseEvent",
  "Navigator",
  "Node",
  "ShadowRoot",
  "css",
  "Window",
] }

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = [
  "Document",
  "DomImplementation",
  "Element",
  "EventInit",
  "HtmlButtonElement",
  "HtmlIFrameElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "MediaQueryList",
  "MouseEvent",
  "MouseEventInit",
  "ShadowRootInit",
  "ShadowRootMode",
  "Window",
] }
