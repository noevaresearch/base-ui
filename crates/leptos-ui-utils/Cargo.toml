[package]
name = "leptos-ui-utils"
description = "Shared utilities for the Leptos port of Base UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
  "AddEventListenerOptions",
  "console",
  "Event",
  "EventListenerOptions",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = [
  "Document",
  "Element",
  "EventInit",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "MediaQueryList",
  "MouseEvent",
  "Window",
] }
