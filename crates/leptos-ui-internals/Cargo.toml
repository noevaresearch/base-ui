[package]
name = "leptos-ui-internals"
description = "Shared internal infrastructure for the Leptos port of Base UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
floating-ui-core = { workspace = true }
floating-ui-dom = { workspace = true }
floating-ui-utils = { workspace = true }
futures = { workspace = true }
js-sys = { workspace = true }
leptos-ui-utils = { path = "../leptos-ui-utils" }
reactive_graph = { workspace = true }
send_wrapper = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
  "AddEventListenerOptions",
  "AssignedNodesOptions",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "FocusEvent",
  "FocusEventInit",
  "FocusOptions",
  "HtmlDetailsElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "Node",
  "NodeList",
  "Performance",
  "PointerEvent",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "ShadowRoot",
  "SvgElement",
  "Touch",
  "TouchEvent",
  "TouchList",
  "Window",
] }

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "EventInit",
  "FocusEventInit",
  "HtmlIFrameElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "KeyboardEventInit",
  "MouseEventInit",
  "Node",
  "PointerEventInit",
  "ShadowRootInit",
  "ShadowRootMode",
] }
